# MayorClips HTTPS Reverse Proxy & Media Hosting
# Configuración para añadir en /etc/nginx/sites-available/ en el VPS 166.0.112.247

server {
    listen 80;
    server_name publisher.mayorclips.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name publisher.mayorclips.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/publisher.mayorclips.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publisher.mayorclips.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Media temporal para que Meta (Instagram/Facebook) descargue el Reel al publicar
    location /mc-media/ {
        alias /var/www/mc-media/;
        autoindex off;
        expires 24h;
    }

    # API Publisher y callbacks OAuth de Meta, TikTok y Google
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 250M;
    }
}
